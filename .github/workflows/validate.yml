name: validate-evidence
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-validation.txt
      - run: python paper/reproducibility/latest_allen_cahn_evidence/generate_and_audit.py
      - run: python paper/reproducibility/provenance/validate_provenance.py --verify-external
      - run: python paper/reproducibility/provenance/query_claim_evidence.py --claim C1
      - run: python -m unittest discover -s paper/reproducibility/provenance -p 'test_*.py'
      - run: python paper/reproducibility/provenance/audit_comparison.py --check
